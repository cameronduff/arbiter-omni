[project]
name = "arbiter-omni"
version = "0.1.0"
description = "Prototype Multimodal System 1 Decision Engine inspired by Jev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "open-clip-torch>=2.20.0",
    "pillow>=9.5.0",
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "datasets>=5.0.1",
    "transformers>=5.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
